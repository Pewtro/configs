name: Release
permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  workflow_run:
    workflows: ['Test']
    types: [completed]
    branches:
      - 'main'
      - 'next'

env:
  # The node version to release with, generally the latest LTS
  release_node: 24.x

jobs:
  release:
    name: Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # https://github.com/pnpm/action-setup/releases/tag/v6.1.0
        with:
          version: 12.11.2

      - name: Setup Node.js ${{ env.release_node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.release_node }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0 Commit hash taken from https://github.com/changesets/action/tree/v2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish-script
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
