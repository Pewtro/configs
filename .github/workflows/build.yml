name: CI
permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  schedule:
    - cron: '0 12 * * 6'
  pull_request:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # The node version to release with, generally the latest LTS
  release_node: 24.x

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Test against multiple node versions
        # Any currently maintained version, e.g. whether they are current, active or maintenance should be included
        node: [22.x, 24.x, 26.x]
    name: Build, Test & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # https://github.com/pnpm/action-setup/releases/tag/v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Lint, Prettier, and Typecheck
        run: pnpm test:ci

      # Only release with the version set in release_node and on a push to main
      - if: ${{ matrix.node == env.release_node && github.ref == 'refs/heads/main' && github.repository == 'pewtro/configs' }}
        name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # https://github.com/changesets/action/releases/tag/v2.1.2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
